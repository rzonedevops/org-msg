name: Sync Microsoft Graph Repos

on:
  schedule:
    # Run daily at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:
    # Allow manual trigger

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Need write permission to commit changes
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq
      
      - name: Sync repositories
        run: |
          chmod +x sync-repos.sh
          ./sync-repos.sh
      
      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add repos/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: sync repositories from microsoftgraph ($(date +'%Y-%m-%d'))"
            git push
          fi
      
      - name: Display sync summary
        run: |
          echo "Synced repositories:"
          ls -la repos/ || echo "No repos directory found"
          echo ""
          echo "Total repositories:"
          ls -1 repos/ | wc -l
